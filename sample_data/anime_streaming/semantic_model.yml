relationships:
- name: episodes_to_anime
  from: dim_episode.anime_id
  to: dim_anime.anime_id
  relationship_type: many_to_one
  cardinality_contract:
    source: many
    target: one
    enforcement: physical_fk
  description: ''
- name: anime_to_studio
  from: dim_anime.studio_id
  to: dim_studio.studio_id
  relationship_type: many_to_one
  cardinality_contract:
    source: many
    target: one
    enforcement: physical_fk
  description: ''
- name: anime_to_prequel
  from: dim_anime.sequel_of_anime_id
  to: dim_anime.anime_id
  relationship_type: many_to_one
  cardinality_contract:
    source: many
    target: one
    enforcement: physical_fk
  description: ''
- name: anime_genres_to_anime
  from: bridge_anime_genre.anime_id
  to: dim_anime.anime_id
  relationship_type: many_to_one
  cardinality_contract:
    source: many
    target: one
    enforcement: physical_fk
  description: ''
- name: anime_genres_to_genre
  from: bridge_anime_genre.genre_id
  to: dim_genre.genre_id
  relationship_type: many_to_one
  cardinality_contract:
    source: many
    target: one
    enforcement: physical_fk
