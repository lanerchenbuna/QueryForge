join_paths:
- contract_version: '1.0'
  sensitivity: internal
  quality_rules: []
  name: watches_to_anime_via_episode
  from_entity: watch_session
  to_entity: anime
  relationships:
  - watches_to_episode
  - episodes_to_anime
  description: Safe many-to-one path from a playback session to its anime title.
- contract_version: '1.0'
  sensitivity: internal
  quality_rules: []
  name: watches_to_studio_via_episode_anime
  from_entity: watch_session
  to_entity: studio
  relationships:
  - watches_to_episode
  - episodes_to_anime
  - anime_to_studio
  description: Safe many-to-one path from playback to the producing studio.
- contract_version: '1.0'
  sensitivity: internal
  quality_rules: []
  name: watches_to_release_date_via_episode
  from_entity: watch_session
  to_entity: calendar
  relationships:
  - watches_to_episode
  - episodes_to_release_date
  description: Episode release calendar path; distinct from the watch-event calendar.
- contract_version: '1.0'
  sensitivity: internal
  quality_rules: []
  name: merch_items_to_anime_via_product
  from_entity: merch_order_item
  to_entity: anime
  relationships:
  - merch_items_to_product
  - merch_products_to_anime
  description: Safe path from merchandise lines to licensed anime titles.
- contract_version: '1.0'
  sensitivity: internal
  quality_rules: []
  name: merch_items_to_user_via_order
  from_entity: merch_order_item
  to_entity: user
  relationships:
  - merch_items_to_order
  - merch_orders_to_user
  description: Safe path from merchandise lines to purchasing users.
- contract_version: '1.0'
  sensitivity: internal
  quality_rules: []
  name: merch_items_to_date_via_order
  from_entity: merch_order_item
  to_entity: calendar
  relationships:
  - merch_items_to_order
  - merch_orders_to_date
  description: Safe path from merchandise lines to order dates.
- contract_version: '1.0'
  sensitivity: internal
  quality_rules: []
  name: ads_to_studio_via_anime
  from_entity: ad_impression
  to_entity: studio
  relationships:
  - ads_to_anime
  - anime_to_studio
  description: Safe path from ad impressions to content studios.
metrics:
- contract_version: '1.0'
  owner: engagement-analytics
  sla: PT1H
  refresh_frequency: hourly
  sensitivity: internal
  quality_rules: []
  name: watch_hours
  description: Total playback seconds converted to hours at watch-session grain.
  entity: watch_session
  aggregation: sum
  expression: SUM(fact_watch_session.watch_seconds) / 3600.0
  synonyms:
  - watch hours
  - viewing hours
  - hours watched
  - stream time
  default_filters: []
  allowed_dimensions:
  - watch_session.device
  - watch_session.playback_region
  - watch_session.rewatch
  - user.country
  - user.region
  - user.age_band
  - anime.title
  - anime.format
  - anime.release_year
  - studio.name
  - calendar.year
  - calendar.month
  time_field: fact_watch_session.watch_date_key
- contract_version: '1.0'
  owner: engagement-analytics
  sensitivity: internal
  quality_rules: []
  name: completion_rate
  description: Completed playback sessions divided by all playback sessions.
  entity: watch_session
  aggregation: ratio
  expression: CAST(SUM(fact_watch_session.completed_flag) AS REAL) / NULLIF(COUNT(*), 0)
  synonyms:
  - completion rate
  - completed view rate
  default_filters: []
  allowed_dimensions:
  - watch_session.device
  - watch_session.playback_region
  - user.region
  - anime.title
  - anime.format
  - studio.name
  - calendar.year
  - calendar.month
  time_field: fact_watch_session.watch_date_key
- contract_version: '1.0'
  owner: engagement-analytics
  sensitivity: internal
  quality_rules: []
  name: unique_viewers
  description: Distinct users with at least one watch session.
  entity: watch_session
  aggregation: count
  expression: COUNT(DISTINCT fact_watch_session.user_id)
  synonyms:
  - unique viewers
  - viewers
  - audience reach
  default_filters: []
  allowed_dimensions:
  - watch_session.playback_region
  - user.country
  - user.region
  - anime.title
  - anime.format
  - studio.name
  - calendar.year
  - calendar.month
  time_field: fact_watch_session.watch_date_key
- contract_version: '1.0'
  owner: engagement-analytics
  sensitivity: internal
  quality_rules: []
  name: average_rating
  description: Mean user rating score on a one-to-ten scale.
  entity: rating
  aggregation: ratio
  expression: CAST(SUM(fact_rating.score) AS REAL) / NULLIF(COUNT(*), 0)
  synonyms:
  - average rating
  - mean score
  - audience score
  default_filters: []
  allowed_dimensions:
  - anime.title
  - anime.format
  - anime.release_year
  - user.region
  - calendar.year
  - calendar.month
  time_field: fact_rating.rating_date_key
- contract_version: '1.0'
  owner: monetization-analytics
  sensitivity: confidential
  quality_rules: []
  name: subscription_revenue
  description: Recognized subscription revenue in US dollars.
  entity: subscription
  aggregation: sum
  expression: SUM(fact_subscription.recognized_revenue_usd)
  synonyms:
  - subscription revenue
  - membership revenue
  default_filters: []
  allowed_dimensions:
  - subscription.plan
  - subscription.status
  - subscription.billing_cycle
  - user.country
  - user.region
  - user.acquisition_channel
  - calendar.year
  - calendar.month
  time_field: fact_subscription.start_date_key
- contract_version: '1.0'
  owner: monetization-analytics
  sensitivity: internal
  quality_rules: []
  name: active_subscribers
  description: Distinct users with an active subscription record.
  entity: subscription
  aggregation: count
  expression: COUNT(DISTINCT fact_subscription.user_id)
  synonyms:
  - active subscribers
  - paid members
  default_filters:
  - fact_subscription.status = 'Active'
  allowed_dimensions:
  - subscription.plan
  - subscription.billing_cycle
  - user.region
  - user.acquisition_channel
  time_field: fact_subscription.start_date_key
- contract_version: '1.0'
  owner: ads-analytics
  sensitivity: internal
  quality_rules: []
  name: ad_revenue
  description: Advertising revenue recognized per impression in US dollars.
  entity: ad_impression
  aggregation: sum
  expression: SUM(fact_ad_impression.revenue_usd)
  synonyms:
  - ad revenue
  - advertising revenue
  default_filters: []
  allowed_dimensions:
  - ad_impression.format
  - ad_impression.industry
  - ad_impression.placement
  - anime.title
  - anime.format
  - studio.name
  - user.region
  - calendar.year
  - calendar.month
  time_field: fact_ad_impression.impression_date_key
- contract_version: '1.0'
  owner: ads-analytics
  sensitivity: internal
  quality_rules: []
  name: ad_click_through_rate
  description: Clicked impressions divided by all ad impressions.
  entity: ad_impression
  aggregation: ratio
  expression: CAST(SUM(fact_ad_impression.clicked_flag) AS REAL) / NULLIF(COUNT(*), 0)
  synonyms:
  - ad click through rate
  - ad CTR
  - CTR
  default_filters: []
  allowed_dimensions:
  - ad_impression.format
  - ad_impression.industry
  - ad_impression.placement
  - anime.format
  - user.region
  - calendar.year
  - calendar.month
  time_field: fact_ad_impression.impression_date_key
- contract_version: '1.0'
  owner: commerce-analytics
  sensitivity: internal
  quality_rules: []
  name: merch_gmv
  description: Merchandise line net amount before order-level shipping.
  entity: merch_order_item
  aggregation: sum
  expression: SUM(fact_merch_order_item.net_amount_usd)
  synonyms:
