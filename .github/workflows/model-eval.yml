name: model-evaluation

# Tier 3 of the step-16 evaluation: a real model, real API spend, real latency.
#
# It is deliberately NOT part of push/PR CI:
#   * the numbers are not comparable with the deterministic tier-1/2 gates, and
#     mixing them would let a model flake look like a product regression;
#   * it needs provider credentials and costs money per run.
# Run manually for release checks or substantial model/prompt changes. It refuses
# to run without credentials so a missing secret is an explicit failure instead
# of a silent pass.

"on":
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of gold cases to evaluate"
        required: false
        default: "40"
      provider:
        description: "Model provider (must match the configured secret)"
        required: false
        default: "openai"
      model:
        description: "Model name"
        required: false
        default: "gpt-4o-mini"

permissions:
  contents: read

concurrency:
  group: model-evaluation
  cancel-in-progress: false

jobs:
  model-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ``load_config`` only reads the *provider-specific* variables declared in
      # ``models.yml`` (openai -> OPENAI_API_KEY / OPENAI_MODEL /
      # OPENAI_BASE_URL, and so on). A generic ``LLM_API_KEY`` is never consulted
      # by the loader, so subscribing only that name let the credential gate below
      # pass while every real model call failed with "No API key is configured
      # for provider 'openai'". Every provider therefore maps its own secret here.
      #
      # All of them are populated from the same optional secret so a single
      # repository secret can drive whichever provider is dispatched; a provider
      # whose variable stays empty simply fails at the gate below.
      #
      # Only the api-key variables are fanned out. The model/base-url variables
      # are deliberately NOT set here: ``--model-provider``/``--model`` are passed
      # explicitly to both evaluation steps, so a fanned-out ``*_MODEL`` would be
      # a second, contradicting source of truth.
      LLM_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
      LLM_MODEL: ${{ github.event.inputs.model || 'gpt-4o-mini' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.LLM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.LLM_API_KEY }}
      QWEN_API_KEY: ${{ secrets.LLM_API_KEY }}
      GLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.LLM_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m queryforge --prepare-sample-data
      - run: python sample/generate_aux_datasets.py
      - name: Require provider credentials
        run: |
          # Check the variable ``load_config`` actually reads for the dispatched
          # provider — not the generic LLM_API_KEY, which the loader ignores.
          case "${LLM_PROVIDER}" in
            openai)   key="${OPENAI_API_KEY}" ;;
            claude)   key="${ANTHROPIC_API_KEY}" ;;
            gemini)   key="${GEMINI_API_KEY}" ;;
            deepseek) key="${DEEPSEEK_API_KEY}" ;;
            qwen)     key="${QWEN_API_KEY:-${DASHSCOPE_API_KEY}}" ;;
            glm)      key="${GLM_API_KEY:-${ZAI_API_KEY}}" ;;
            *)
              echo "Unsupported provider '${LLM_PROVIDER}' for this workflow." >&2
              exit 1
              ;;
          esac
          if [ -z "${key}" ]; then
            echo "No API key is configured for provider '${LLM_PROVIDER}'; tier 3 cannot run." >&2
            echo "Add the repository secret LLM_API_KEY (mapped to the provider-specific variable)" >&2
            echo "or dispatch this workflow manually with credentials." >&2
            exit 1
          fi
      - name: Evaluate the NL2SQL gold set with a real model
        run: |
          # ``--model-provider`` / ``--model`` are passed explicitly: without them
          # this step silently ignored the dispatched ``model`` input and used the
          # provider default from models.yml instead.
          python scripts/evaluate_sql.py \
            --cases evaluation/gold/nl2sql_multidomain.jsonl \
            --limit "${{ github.event.inputs.limit || 40 }}" \
            --model-provider "${LLM_PROVIDER}" \
            --model "${LLM_MODEL}" \
            --output evaluation/reports/nl2sql_model_eval.json
      - name: Tier-3 agent task report (recorded, not gating)
        run: |
          python scripts/benchmark_agent.py \
            --tier 3 \
            --provider "${LLM_PROVIDER}" \
            --model "${LLM_MODEL}" \
            --split regression \
            --report evaluation/reports/agent_benchmark_tier3.json
      - name: Publish summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [
              "# Tier-3 model evaluation",
              "",
              "Model numbers are reported separately from the deterministic tier-1/2",
              "gates: a model flake must never read as a product regression.",
              "",
          ]
          for name in (
              "evaluation/reports/nl2sql_model_eval.json",
              "evaluation/reports/agent_benchmark_tier3.json",
          ):
              path = Path(name)
              if not path.is_file():
                  lines.append(f"- `{name}`: not produced")
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              lines.append(f"- `{name}`: produced")
              metrics = payload.get("metrics") or {}
              for key in sorted(metrics)[:12]:
                  lines.append(f"  - {key}: `{metrics[key]}`")
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation-report
          path: evaluation/reports/
          if-no-files-found: warn
