name: Feature request
description: Propose an improvement to QueryForge
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired interface and outcome.
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Semantic and security considerations
      description: Note effects on metrics, grain, joins, data visibility, or SQL policy.
