<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">QueryForge — governed AI analytics</title>
  <desc id="desc">Animated data streams connect natural language, semantic context, governed SQL, and trusted results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset=".52" stop-color="#101A38"/>
      <stop offset="1" stop-color="#071021"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7C5CFC" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#2DD4BF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#070B18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFC" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93C5FD" stroke-opacity=".055"/>
      <circle cx="0" cy="0" r="1.2" fill="#93C5FD" fill-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="480" rx="28"/></clipPath>
    <path id="leftPath" d="M88 314 C190 314 196 238 318 238"/>
    <path id="rightPath" d="M882 238 C1004 238 1010 314 1112 314"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="480" fill="url(#bg)"/>
    <rect width="1200" height="480" fill="url(#grid)"/>
    <ellipse cx="600" cy="225" rx="430" ry="330" fill="url(#halo)"/>
    <circle cx="140" cy="80" r="110" fill="#7C5CFC" fill-opacity=".09" filter="url(#soft)"/>
    <circle cx="1080" cy="390" r="135" fill="#2DD4BF" fill-opacity=".08" filter="url(#soft)"/>

    <g opacity=".62">
      <path d="M-30 97 H198 L238 137 H330" fill="none" stroke="#7C5CFC" stroke-opacity=".33"/>
      <circle cx="330" cy="137" r="3" fill="#A78BFA"/>
      <path d="M1230 90 H1025 L978 137 H880" fill="none" stroke="#2DD4BF" stroke-opacity=".28"/>
      <circle cx="880" cy="137" r="3" fill="#2DD4BF"/>
      <path d="M-20 408 H236 L270 374 H362" fill="none" stroke="#60A5FA" stroke-opacity=".22"/>
      <circle cx="362" cy="374" r="3" fill="#60A5FA"/>
      <path d="M1220 410 H975 L938 374 H842" fill="none" stroke="#7C5CFC" stroke-opacity=".22"/>
      <circle cx="842" cy="374" r="3" fill="#A78BFA"/>
    </g>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <g transform="translate(52 268)">
        <rect width="212" height="92" rx="18" fill="#0D1630" stroke="#7C5CFC" stroke-opacity=".5"/>
        <circle cx="30" cy="28" r="9" fill="#A78BFA" fill-opacity=".18" stroke="#A78BFA"/>
        <path d="M26 28h8M30 24v8" stroke="#A78BFA" stroke-width="1.5"/>
        <text x="50" y="33" fill="#DDD6FE" font-size="14" font-weight="650">NATURAL LANGUAGE</text>
        <text x="24" y="62" fill="#94A3B8" font-size="12">“Revenue by segment?”</text>
        <rect x="24" y="72" width="122" height="3" rx="1.5" fill="#7C5CFC" fill-opacity=".22"/>
      </g>

      <g transform="translate(936 268)">
        <rect width="212" height="92" rx="18" fill="#0D1C2B" stroke="#2DD4BF" stroke-opacity=".5"/>
        <circle cx="30" cy="28" r="9" fill="#2DD4BF" fill-opacity=".14" stroke="#2DD4BF"/>
        <path d="m26 28 3 3 6-7" fill="none" stroke="#2DD4BF" stroke-width="1.7"/>
        <text x="50" y="33" fill="#CCFBF1" font-size="14" font-weight="650">TRUSTED RESULT</text>
        <text x="24" y="62" fill="#94A3B8" font-size="12">Audited · Read-only · Traced</text>
        <rect x="24" y="72" width="164" height="3" rx="1.5" fill="#2DD4BF" fill-opacity=".20"/>
      </g>

      <use href="#leftPath" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="8 9">
        <animate attributeName="stroke-dashoffset" from="0" to="-34" dur="2.2s" repeatCount="indefinite"/>
      </use>
      <use href="#rightPath" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="8 9">
        <animate attributeName="stroke-dashoffset" from="0" to="-34" dur="2.2s" repeatCount="indefinite"/>
      </use>
      <circle r="4" fill="#A78BFA" filter="url(#glow)">
        <animateMotion dur="2.7s" repeatCount="indefinite"><mpath href="#leftPath"/></animateMotion>
      </circle>
      <circle r="4" fill="#2DD4BF" filter="url(#glow)">
        <animateMotion dur="2.7s" begin=".8s" repeatCount="indefinite"><mpath href="#rightPath"/></animateMotion>
      </circle>

      <g transform="translate(320 190)">
        <rect width="560" height="96" rx="24" fill="#0B1227" fill-opacity=".92" stroke="url(#brand)" stroke-width="1.4"/>
        <rect x="1" y="1" width="558" height="94" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".06"/>
        <g transform="translate(28 20)">
          <path d="M28 0 52 14v28L28 56 4 42V14Z" fill="url(#brand)" fill-opacity=".18" stroke="url(#brand)" stroke-width="1.5"/>
          <path d="M17 18h22M17 28h15M17 38h19" stroke="#E0E7FF" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="40" cy="18" r="3" fill="#2DD4BF"/>
        </g>
        <text x="104" y="48" fill="#F8FAFC" font-size="30" font-weight="760" letter-spacing="1.5">QUERYFORGE</text>
        <text x="106" y="70" fill="#93C5FD" font-size="12" letter-spacing="2.3">GOVERNED AI ANALYTICS</text>
        <g transform="translate(474 30)">
          <circle cx="18" cy="18" r="17" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".6">
            <animate attributeName="r" values="15;19;15" dur="2.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".8;.25;.8" dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <path d="m11 18 5 5 10-12" fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g transform="translate(383 323)">
        <rect width="434" height="54" rx="14" fill="#080E1F" stroke="#334155"/>
        <circle cx="22" cy="18" r="4" fill="#FB7185"/>
        <circle cx="36" cy="18" r="4" fill="#FBBF24"/>
        <circle cx="50" cy="18" r="4" fill="#34D399"/>
        <text x="22" y="39" fill="#64748B" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">SQL</text>
        <text x="66" y="33" fill="#CBD5E1" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
          <tspan fill="#C4B5FD">SELECT</tspan>
          <tspan> segment, </tspan>
          <tspan fill="#67E8F9">SUM</tspan>
          <tspan>(net_revenue) </tspan>
          <tspan fill="#C4B5FD">FROM</tspan>
          <tspan> orders</tspan>
        </text>
      </g>

      <g fill="#94A3B8" font-size="11" letter-spacing="1.2">
        <text x="394" y="410">SEMANTIC LAYER</text>
        <text x="548" y="410">AST POLICY</text>
        <text x="672" y="410">QUALITY GATES</text>
      </g>
      <g>
        <circle cx="380" cy="406" r="3" fill="#A78BFA"/>
        <circle cx="534" cy="406" r="3" fill="#60A5FA"/>
        <circle cx="658" cy="406" r="3" fill="#2DD4BF"/>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="478.5" rx="27.25" fill="none" stroke="#93C5FD" stroke-opacity=".16" stroke-width="1.5"/>
</svg>
